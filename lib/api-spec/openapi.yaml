openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chatbot operations
  - name: suggestedQuestions
    description: Suggested questions from the knowledge base
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message to the AI assistant
      description: Sends a user message and receives an AI-generated answer from the Excel knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response with source citation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /suggested-questions:
    get:
      operationId: getSuggestedQuestions
      tags: [suggestedQuestions]
      summary: Get suggested questions from the knowledge base
      description: Returns a list of sample questions from the الاستفسارات Excel file
      responses:
        "200":
          description: Suggested questions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedQuestionsResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessageInput:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: User question in Arabic
        history:
          type: array
          description: Previous conversation messages
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
    ChatHistoryItem:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
    ChatResponse:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: AI-generated answer
        source:
          type: ["string", "null"]
          description: Source file or article reference
    SuggestedQuestionsResponse:
      type: object
      required:
        - questions
      properties:
        questions:
          type: array
          items:
            type: string
          description: List of suggested questions from the knowledge base
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
